<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCBT कृषि मित्र</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #efeae2; display: flex; justify-content: center; height: 100vh; }
        .chat-app { width: 100%; max-width: 500px; height: 100vh; background: #efeae2; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .chat-header { background: #075e54; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-info h3 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 11px; opacity: 0.85; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14.2px; line-height: 1.45; word-wrap: break-word; }
        .user-msg { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; }
        .bot-msg { background: white; align-self: flex-start; border-top-left-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
        .source-card { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; }
        .video-btn { display: inline-flex; align-items: center; gap: 6px; background: #ffebee; color: #c62828; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 5px; border: 1px solid #ffcdd2; }
        .video-btn:hover { background: #ffcdd2; }
        .chat-footer { padding: 10px; background: #f0f2f5; display: flex; gap: 8px; align-items: center; }
        .chat-input { flex: 1; border: none; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; background: white; }
        .send-btn { background: #00a884; border: none; width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        
        /* Sprouting Plant Loader */
        .plant-loader { display: none; align-self: flex-start; background: white; padding: 8px 16px; border-radius: 18px; margin-bottom: 5px; }
        .plant-anim { display: inline-block; animation: sprout 1.2s infinite ease-in-out; font-size: 20px; }
        @keyframes sprout {
            0% { transform: scale(0.8) rotate(-10deg); opacity: 0.6; }
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(0.8) rotate(-10deg); opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="chat-header">
        <div class="avatar">🌱</div>
        <div class="header-info">
            <h3>TCBT प्राकृतिक कृषि मित्र</h3>
            <p>ताराचंद बेलजी कृषि पाठशाला सहायक</p>
        </div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="msg bot-msg">
            नमस्ते किसान भाई! 🙏<br>
            आप TCBT, पंच महाभूत कृषि, जीवामृत या 3G कटिंग से जुड़ा कोई भी सवाल पूछ सकते हैं।
        </div>
    </div>

    <div class="plant-loader" id="plantLoader">
        <span class="plant-anim">🌱</span> <span style="font-size:12px; color:#555; margin-left:5px;">पौधा तैयार हो रहा है (खोज जारी है)...</span>
    </div>

    <div class="chat-footer">
        <input type="text" id="userInput" class="chat-input" placeholder="यहाँ अपना सवाल लिखें..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendQuery()">➤</button>
    </div>
</div>

<script>
    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const plantLoader = document.getElementById('plantLoader');

    function handleKey(e) {
        if (e.key === 'Enter') sendQuery();
    }

    async function sendQuery() {
        const text = userInput.value.trim();
        if (!text) return;

        // User Message Render
        appendMessage(text, 'user-msg');
        userInput.value = '';
        plantLoader.style.display = 'flex';
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
            const res = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: text })
            });

            const data = await res.json();
            plantLoader.style.display = 'none';

            if (!res.ok) {
                appendMessage(data.detail || 'Kuch gadbad hui.', 'bot-msg');
                return;
            }

            let botHtml = data.answer.replace(/\n/g, '<br>');
            if (data.sources && data.sources.length > 0) {
                botHtml += '<div class="source-card"><b>📺 संबन्धित वीडियो क्लिप देखें:</b><br>';
                data.sources.forEach((s, i) => {
                    botHtml += `<a href="${s.video_url}" target="_blank" class="video-btn">▶️ [${s.duration}] ${s.title.substring(0, 30)}...</a><br>`;
                });
                botHtml += '</div>';
            }

            appendMessage(botHtml, 'bot-msg', true);
        } catch (err) {
            plantLoader.style.display = 'none';
            appendMessage('Network issue. Kripya dobara koshish karein.', 'bot-msg');
        }
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage(content, className, isHtml = false) {
        const div = document.createElement('div');
        div.className = `msg ${className}`;
        if (isHtml) div.innerHTML = content;
        else div.textContent = content;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
    }
</script>

</body>
</html>
